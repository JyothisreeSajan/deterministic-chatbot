fragment_id: mdo_admin_lookup
# Looks up the MDO contact for the user's organisation — prefers MDO_LEADER,
# falls back to MDO_ADMIN when no leader is found. A single search call filters
# on both roles at once (backend OR-matches organisations.roles); leader-over-
# admin priority is then resolved client-side via the mdo_* transforms since
# the API gives no ordering guarantee between the two roles.
#
# Prerequisites — must be in collected before this fragment runs:
#   collected.root_org_id   : rootOrgId from profile read (use _karmayogi_user first)
#
# Fields stored:
#   collected.mdo_admin_name   : contact first name (or None if not found)
#   collected.mdo_admin_email  : contact primary email (or None if not found)
#   collected.mdo_admin_count  : number of leader/admin matches found (0 = use YP fallback)
#   collected.mdo_role_type    : "MDO_LEADER" | "MDO_ADMIN" | None — which role matched
#
# The flow that imports this fragment MUST define:
#   - mdo_found_result    (on_success target — branch on mdo_admin_count)
#   - mdo_api_error       (on_error target)

nodes:
  - id: lookup_mdo_admin
    type: api_call
    integration: karmayogi
    request:
      method: POST
      url: "/api/private/user/v1/search"
      body:
        request:
          filters:
            rootOrgId: "{{ ctx.collected.root_org_id }}"
            organisations.roles: ["MDO_LEADER", "MDO_ADMIN"]
            status: 1
          limit: 10
    response_mapping:
      - { from: "$.response.count",       to: collected.mdo_admin_count }
      - { from: "$.response.content[*]",  to: collected.mdo_admin_name,  transform: mdo_personal_name }
      - { from: "$.response.content[*]",  to: collected.mdo_admin_email, transform: mdo_personal_email }
      - { from: "$.response.content[*]",  to: collected.mdo_role_type,   transform: mdo_role_type }
    on_success: mdo_found_result
    on_error:
      any: mdo_api_error
    timeout_ms: 5000
